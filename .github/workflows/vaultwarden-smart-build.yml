# Vaultwarden Smart Build
# Windows "auto-version-tracking + auto-publish + auto-cleanup" workflow.
# Modes: schedule (daily auto-track, smart skip) / workflow_dispatch (manual, release|latest|custom).

name: Vaultwarden Smart Build

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      tag_choice:
        description: "Version selection"
        required: true
        default: release
        type: choice
        options: [release, latest, custom]
      tag:
        description: "Custom ref (commit/tag/branch) — used when tag_choice=custom"
        required: false
        default: ""
      dry_run:
        description: "Check only (no build)"
        required: false
        default: false
        type: boolean

# Schedule and manual release share one group -> serialized (building the same
# version concurrently only wastes Windows minutes and causes cleanup races);
# latest/custom get independent groups and do not block each other.
concurrency:
  group: vw-${{ github.event.inputs.tag_choice || 'release' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPSTREAM: dani-garcia/vaultwarden
  WEB_VAULT_UPSTREAM: dani-garcia/bw_web_builds
  RELEASE_PREFIX: vw-win-

jobs:
  # Decision layer: on cheap ubuntu, fetch upstream, validate inputs, decide
  # whether to build. All lightweight logic runs here so the Windows runner is
  # only started when compilation is actually needed.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.version_check.outputs.should_build }}
      target_tag: ${{ steps.target_version.outputs.target_tag }}
      mode: ${{ steps.resolve.outputs.mode }}
      upstream_version: ${{ steps.target_version.outputs.upstream_version }}
      latest_tag: ${{ steps.get_latest.outputs.latest_tag }}
      target_sha: ${{ steps.deref_sha.outputs.target_sha }}
    steps:
      - name: Resolve inputs
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INP_TAG_CHOICE: ${{ github.event.inputs.tag_choice }}
          INP_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "schedule" ]; then
            mode="release"
            custom=""
          else
            mode="${INP_TAG_CHOICE:-release}"
            case "$mode" in release|latest|custom) ;; *) mode="release" ;; esac
            custom="${INP_TAG:-}"
          fi
          {
            echo "mode=$mode"
            echo "custom=$custom"
          } >> "$GITHUB_OUTPUT"

      - name: Get latest upstream tag
        id: get_latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          r=$(curl -fsSL --retry 3 --retry-delay 3 \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "User-Agent: vw-smart" \
                "https://api.github.com/repos/$UPSTREAM/releases/latest")
          tag=$(printf '%s' "$r" | jq -r '.tag_name // empty')
          [ -n "$tag" ] || { echo "::error::upstream latest release has no tag_name"; exit 1; }
          echo "latest_tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Resolve target version
        id: target_version
        env:
          MODE: ${{ steps.resolve.outputs.mode }}
          CUSTOM: ${{ steps.resolve.outputs.custom }}
          LATEST_TAG: ${{ steps.get_latest.outputs.latest_tag }}
        run: |
          set -euo pipefail
          target=""
          case "$MODE" in
            release)
              [ -n "$LATEST_TAG" ] || { echo "::error::no upstream release for release mode"; exit 1; }
              target="$LATEST_TAG"
              echo "upstream_version=${LATEST_TAG#v}" >> "$GITHUB_OUTPUT"
              ;;
            latest)
              target=""
              echo "upstream_version=main" >> "$GITHUB_OUTPUT"
              ;;
            custom)
              t="$CUSTOM"
              [ -n "$t" ] || { echo "::error::custom tag required"; exit 1; }
              # Character allowlist + path-traversal guard (injection hardening on the cheap runner)
              printf '%s' "$t" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]{0,127}$' \
                || { echo "::error::custom ref has invalid characters"; exit 1; }
              printf '%s' "$t" | grep -Eq '\.\.|//' \
                && { echo "::error::custom ref looks like path traversal"; exit 1; } || true
              printf '%s' "$t" | grep -Eq '(^[./-]|[./-]$)' \
                && { echo "::error::custom ref has bad leading/trailing char"; exit 1; } || true
              target="$t"
              echo "upstream_version=custom" >> "$GITHUB_OUTPUT"
              ;;
          esac
          echo "target_tag=$target" >> "$GITHUB_OUTPUT"

      # [schedule only] Dereference the tag -> short commit sha, for precise
      # dedup (does not rely on the time-limited actions.cache).
      - name: Resolve target commit sha
        id: deref_sha
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.target_version.outputs.target_tag }}
        run: |
          set -euo pipefail
          ref=$(curl -fsSL --retry 3 --retry-delay 3 \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H "User-Agent: vw-smart" \
                  "https://api.github.com/repos/$UPSTREAM/git/ref/tags/$(printf '%s' "$TAG" | sed 's/[&/\]/\\&/g')")
          otype=$(printf '%s' "$ref" | jq -r '.object.type')
          osha=$(printf '%s' "$ref"   | jq -r '.object.sha')
          if [ "$otype" = "tag" ]; then
            to=$(curl -fsSL --retry 3 --retry-delay 3 \
                   -H "Authorization: Bearer $GH_TOKEN" \
                   -H "User-Agent: vw-smart" \
                   "https://api.github.com/repos/$UPSTREAM/git/tags/$osha")
            commit=$(printf '%s' "$to" | jq -r '.object.sha')
          else
            commit="$osha"
          fi
          [ -n "$commit" ] || { echo "::error::cannot resolve commit sha for $TAG"; exit 1; }
          echo "target_sha=${commit:0:12}" >> "$GITHUB_OUTPUT"

      - name: Decide whether to build
        id: version_check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          VER: ${{ steps.target_version.outputs.upstream_version }}
          SHA: ${{ steps.deref_sha.outputs.target_sha }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          should=true; reason="manual"
          if [ "$EVENT_NAME" = "schedule" ]; then
            # Check our own releases for an existing build of this version@commit,
            # rather than relying on the LRU-evictable actions.cache.
            found=false
            for p in 1 2 3 4 5; do
              j=$(curl -fsSL --retry 3 --retry-delay 3 \
                    -H "Authorization: Bearer $GH_TOKEN" -H "User-Agent: vw-smart" \
                    "https://api.github.com/repos/$REPO/releases?per_page=100&page=$p" || echo '[]')
              if printf '%s' "$j" | jq -r '.[].tag_name' \
                   | grep -Eq "^${RELEASE_PREFIX}v?${VER}.*-${SHA}(-|$)"; then
                found=true; break
              fi
              n=$(printf '%s' "$j" | jq 'length')
              [ "$n" -lt 100 ] && break
            done
            if [ "$found" = true ]; then should=false; reason="already built ($VER @ $SHA)"; else should=true; reason="new ($VER @ $SHA)"; fi
          fi
          if [ "${DRY_RUN:-false}" = true ]; then should=false; reason="$reason [dry-run]"; fi
          echo "::notice::decision: should_build=$should reason=$reason"
          echo "should_build=$should" >> "$GITHUB_OUTPUT"

  # Execution layer: compile, package, publish, cleanup.
  # Started only when check decides should_build=true.
  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      MODE: ${{ needs.check.outputs.mode }}
      VCPKG_ROOT: C:\vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows-static
      OPENSSL_STATIC: 1
    steps:
      - name: Checkout Vaultwarden source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dani-garcia/vaultwarden
          ref: ${{ needs.check.outputs.target_tag }}
          path: vaultwarden
          fetch-depth: 0
          persist-credentials: false

      - name: Parse web-vault version
        id: webvault_version
        shell: pwsh
        working-directory: vaultwarden
        run: |
          $line = Select-String -Path docker/DockerSettings.yaml `
                   -Pattern '^\s*vault_version:\s*["'']?([^"''\s#]+)' |
                   Select-Object -First 1
          if (-not $line) { Write-Error "vault_version not found"; exit 1 }
          $v = $line.Matches.Groups[1].Value
          if ($v -notmatch '^[A-Za-z0-9._\-/]+$') { Write-Error "bad web-vault version: $v"; exit 1 }
          "web_vault_version=$v" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore web-vault cache
        id: webvault_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web-vault
          key: web-vault-${{ steps.webvault_version.outputs.web_vault_version }}-v4

      - name: Download web-vault
        if: steps.webvault_cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          WEB_VAULT_VERSION: ${{ steps.webvault_version.outputs.web_vault_version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $v = $env:WEB_VAULT_VERSION
          $h = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; "User-Agent" = "vw-smart"; Accept = "application/vnd.github+json" }
          $esc = [uri]::EscapeDataString($v)
          $rel = $null
          try {
            $rel = Invoke-RestMethod "https://api.github.com/repos/$env:WEB_VAULT_UPSTREAM/releases/tags/$esc" `
                    -Headers $h -MaximumRetryCount 3 -RetryIntervalSec 5
          } catch { Write-Host "direct tag fetch failed, trying list pagination" }
          if (-not $rel) {
            foreach ($p in 1..5) {
              $list = Invoke-RestMethod "https://api.github.com/repos/$env:WEB_VAULT_UPSTREAM/releases?per_page=100&page=$p" -Headers $h
              $hit = $list | Where-Object tag_name -eq $v | Select-Object -First 1
              if ($hit) { $rel = $hit; break }
            }
          }
          if (-not $rel) { Write-Error "no web-vault release for $v"; exit 1 }
          $asset = $rel.assets | Where-Object name -like '*.tar.gz' | Select-Object -First 1
          if (-not $asset) { Write-Error "no .tar.gz asset"; exit 1 }
          Invoke-WebRequest $asset.browser_download_url -OutFile $asset.name -Headers $h
          if (Test-Path web-vault) { Remove-Item -Recurse -Force web-vault }
          tar -xf $asset.name
          if (-not (Test-Path web-vault/index.html)) {
            $f = Get-ChildItem -Directory -Recurse -Depth 2 |
                 Where-Object { Test-Path (Join-Path $_.FullName 'index.html') } |
                 Select-Object -First 1
            if ($f) { Move-Item $f.FullName web-vault -Force }
          }
          if (-not (Test-Path web-vault/index.html)) { Write-Error "web-vault/index.html missing after extract"; exit 1 }

      # Tiered caching: only release writes back. latest/custom produce one-off
      # artifacts (older front-ends) that will never be reused; read-only saves
      # ~2 min upload time and prevents cache key bloat.
      - name: Save web-vault cache
        if: steps.webvault_cache.outputs.cache-hit != 'true' && success() && env.MODE == 'release'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web-vault
          key: web-vault-${{ steps.webvault_version.outputs.web_vault_version }}-v4

      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1 #v1
        with:
          toolchain: stable
          cache: false

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: vaultwarden -> target
          shared-key: vw-rust-win-v4
          add-job-id-key: false   # off: otherwise job-id enters the key and breaks cross-build reuse
          cache-bin: false        # off: otherwise cached rustup shim overrides the fresh toolchain (rustc mismatch)
          # Tiered cache: only release writes back (same rationale as web-vault).
          save-if: ${{ env.MODE == 'release' }}

      # vcpkg: exact-key cache, shared across all modes (OpenSSL is independent
      # of the vaultwarden version and reusable). restore-keys is intentionally
      # omitted: a wide prefix would pull back an ABI-mismatched old OpenSSL on upgrade.
      - name: Get vcpkg version
        id: vcpkg_version
        shell: pwsh
        run: |
          $v = (vcpkg version | Select-Object -First 1).ToString().Trim()
          if ($v -match '-([a-f0-9]{12,})') { $c = $matches[1].Substring(0, 12) } else { $c = 'unknown' }
          "commit=$c" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Restore vcpkg cache
        id: vcpkg_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\vcpkg\installed\x64-windows-static
          key: vcpkg-openssl-static-${{ steps.vcpkg_version.outputs.commit }}-v4

      - name: Check openssl present
        id: vcpkg_check
        shell: pwsh
        run: |
          $ok = Test-Path 'C:\vcpkg\installed\x64-windows-static\lib\libcrypto.lib'
          "skip_vcpkg=$($ok.ToString().ToLower())" | Out-File $env:GITHUB_OUTPUT -Append

      - name: vcpkg integrate
        shell: pwsh
        run: vcpkg integrate install

      - name: vcpkg install openssl
        if: steps.vcpkg_check.outputs.skip_vcpkg != 'true'
        shell: pwsh
        run: vcpkg install openssl:x64-windows-static --clean-after-build

      # Explicit OPENSSL_LIB_DIR/INCLUDE_DIR let openssl-sys locate the library
      # directly, bypassing the vcpkg-rs discovery mechanism: the vcpkg cache
      # stores only installed/x64-windows-static (the lib itself), not
      # installed/vcpkg (the status metadata). When the Rust cache misses and
      # openssl-sys re-runs its build-script, vcpkg-rs crashes on the missing
      # status dir. This MUST be set for all modes: schedule tracks new versions,
      # which always means a Rust cache miss; otherwise the crash recurs on the
      # main path.
      - name: Build
        shell: pwsh
        working-directory: vaultwarden
        env:
          RUSTFLAGS: "-Ctarget-feature=+crt-static -Cstrip=debuginfo"
          OPENSSL_LIB_DIR: 'C:\vcpkg\installed\x64-windows-static\lib'
          OPENSSL_INCLUDE_DIR: 'C:\vcpkg\installed\x64-windows-static\include'
        run: cargo build --locked --no-default-features --features sqlite --release

      - name: Save vcpkg cache
        if: steps.vcpkg_check.outputs.skip_vcpkg != 'true' && success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\vcpkg\installed\x64-windows-static
          key: vcpkg-openssl-static-${{ steps.vcpkg_version.outputs.commit }}-v4

      # Version resolution with fallback: a commit with no reachable tag does
      # not crash, it falls back to "dev".
      - name: Get version
        id: get_version
        shell: pwsh
        working-directory: vaultwarden
        run: |
          $describe = (git describe --tags --always --long 2>$null)
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($describe)) { $describe = "" }
          $sha = (git rev-parse --short=12 HEAD).Trim()
          $ver = $null
          if ($describe -match '^(\d+\.\d+(?:\.\d+)?(?:-[A-Za-z0-9.]+)?)(?:-\d+-g[0-9a-f]+)?$') {
            $ver = "v" + $matches[1]
          }
          if (-not $ver) { $ver = "dev" }
          "vaultwarden_version=$ver" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "vaultwarden_short_sha=$sha" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          Move-Item -Force .\target\release\vaultwarden.exe $env:GITHUB_WORKSPACE\vaultwarden.exe

      # Actually launch the exe and keep it alive for 4 seconds: catches
      # "compiled successfully but crashes on launch due to ABI/static-link
      # mismatch" defects that a mere file-existence check cannot detect.
      - name: Smoke test
        shell: pwsh
        run: |
          $exe = "vaultwarden.exe"
          $size = (Get-Item $exe).Length
          if ($size -lt 1MB) { throw "binary suspiciously small: $size bytes" }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "invalid PE: MZ header missing" }
          $tmp = Join-Path $env:TEMP "vw_smoke"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $outLog = Join-Path $tmp "out.log"; $errLog = Join-Path $tmp "err.log"
          Remove-Item $outLog,$errLog -ErrorAction SilentlyContinue
          $env:DATA_FOLDER = $tmp
          $env:ROCKET_PORT  = "45823"
          $p = Start-Process -FilePath ".\$exe" -PassThru -WindowStyle Hidden `
                -RedirectStandardOutput $outLog -RedirectStandardError $errLog
          Start-Sleep -Seconds 4
          $alive = -not $p.HasExited
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          if (-not $alive) {
            Write-Host "----- stdout -----"; Get-Content $outLog -ErrorAction SilentlyContinue
            Write-Host "----- stderr -----"; Get-Content $errLog -ErrorAction SilentlyContinue
            throw "vaultwarden.exe crashed within 4s (likely ABI/static-link mismatch)"
          }
          Write-Host "Smoke OK: valid PE, launched and stayed alive 4s"

      - name: Package with 7z
        shell: pwsh
        run: |
          7z a -tzip -mx=9 vaultwarden.zip vaultwarden.exe web-vault
          if ($LASTEXITCODE -ne 0) { throw "7z packaging failed with exit code $LASTEXITCODE" }
          $mb = [math]::Round((Get-Item vaultwarden.zip).Length / 1MB, 2)
          "ZIP_SIZE_MB=$mb" | Out-File $env:GITHUB_ENV -Append
          $hash = (Get-FileHash vaultwarden.zip -Algorithm SHA256).Hash.ToLower()
          "ZIP_SHA256=$hash" | Out-File $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vaultwarden-${{ steps.get_version.outputs.vaultwarden_version }}-${{ steps.get_version.outputs.vaultwarden_short_sha }}
          path: vaultwarden.zip
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

      # make_latest only for release; latest/custom are marked prerelease so they
      # never steal the "latest release" slot from a stable build.
      - name: Compute release tag
        id: set_release_tag
        shell: bash
        env:
          VER: ${{ steps.get_version.outputs.vaultwarden_version }}
          SHA: ${{ steps.get_version.outputs.vaultwarden_short_sha }}
          MODE: ${{ env.MODE }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          case "$MODE" in
            release)
              echo "release_tag=${RELEASE_PREFIX}${VER}-${SHA}-r${RUN_NUMBER}" >> "$GITHUB_OUTPUT"
              echo "make_latest=true"  >> "$GITHUB_OUTPUT"
              echo "prerelease=false"  >> "$GITHUB_OUTPUT"
              ;;
            latest|custom)
              echo "release_tag=${RELEASE_PREFIX}${VER}-${SHA}-${MODE}-r${RUN_NUMBER}" >> "$GITHUB_OUTPUT"
              echo "make_latest=false" >> "$GITHUB_OUTPUT"
              echo "prerelease=true"   >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::unknown mode $MODE"; exit 1 ;;
          esac

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.set_release_tag.outputs.release_tag }}
          name: Vaultwarden ${{ steps.get_version.outputs.vaultwarden_version }}
          body: |
            ### Vaultwarden ${{ steps.get_version.outputs.vaultwarden_version }} (Windows · SQLite · static)

            - **Commit**: `${{ steps.get_version.outputs.vaultwarden_short_sha }}`
            - **Mode**: `${{ env.MODE }}`
            - **Web-vault**: `${{ steps.webvault_version.outputs.web_vault_version }}`
            - **Size**: `${{ env.ZIP_SIZE_MB }} MB`
            - **SHA256**: `${{ env.ZIP_SHA256 }}`
            - **Build run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Usage: Extract the archive and run `vaultwarden.exe`, or point to the `web-vault` directory with the `-w` flag.
          files: vaultwarden.zip
          make_latest: ${{ steps.set_release_tag.outputs.make_latest }}
          prerelease: ${{ steps.set_release_tag.outputs.prerelease }}
          fail_on_unmatched_files: true

      # Cleanup in two steps; stable releases are never deleted:
      #  (1) dedup by "version|sha" — same-version builds with different commits
      #      are never grouped together;
      #  (2) cap only prereleases to the newest KEEP, stable releases excluded.
      - name: Cleanup old releases
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CURRENT_TAG: ${{ steps.set_release_tag.outputs.release_tag }}
        run: |
          $h = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; "User-Agent" = "vw-smart"; Accept = "application/vnd.github+json" }
          $CUR  = $env:CURRENT_TAG
          $KEEP = 8

          $all = @()
          for ($p = 1; $p -le 20; $p++) {
            $r = Invoke-RestMethod "https://api.github.com/repos/$env:REPO/releases?per_page=100&page=$p" -Headers $h -ErrorAction SilentlyContinue
            if (-not $r) { break }
            $all += ($r | Where-Object { $_.tag_name -like "$RELEASE_PREFIX*" })
            if ($r.Count -lt 100) { break }
            Start-Sleep -Milliseconds 200
          }
          Write-Host "total vw-win-* releases: $($all.Count)"
          if ($all.Count -eq 0) { exit 0 }

          # Group key = version | sha12. Non-greedy + optional -rN suffix:
          # matches both old and new tag formats and avoids mistaking a very
          # large run_number for a sha.
          function KeyOf($t) {
            if ($t -match '^vw-win-(.+?)-([0-9a-f]{12})(?:-(release|latest|custom))?(?:-r\d+)?$') {
              return "$($matches[1])|$($matches[2])"
            }
            return $null
          }
          function DeleteRel($x) {
            try {
              Invoke-RestMethod -Method Delete "https://api.github.com/repos/$env:REPO/releases/$($x.id)" -Headers $h | Out-Null
            } catch { Write-Host "  release delete failed ($($x.tag_name)): $($_.Exception.Message)"; return $false }
            try { Invoke-RestMethod -Method Delete "https://api.github.com/repos/$env:REPO/git/refs/tags/$($x.tag_name)" -Headers $h | Out-Null } catch {}
            return $true
          }

          $deleted = 0
          $groups = $all | Where-Object { KeyOf $_.tag_name } | Group-Object { KeyOf $_.tag_name }
          foreach ($g in $groups) {
            if ($g.Group.Count -le 1) { continue }
            $sorted = $g.Group | Sort-Object published_at -Descending
            for ($i = 1; $i -lt $sorted.Count; $i++) {
              if ($sorted[$i].tag_name -eq $CUR) { continue }
              if (DeleteRel $sorted[$i]) { Write-Host "  dedup deleted: $($sorted[$i].tag_name)"; $deleted++ }
            }
          }
          $pre = $all | Where-Object { $_.prerelease } | Sort-Object published_at -Descending
          if ($pre.Count -gt $KEEP) {
            for ($i = $KEEP; $i -lt $pre.Count; $i++) {
              if ($pre[$i].tag_name -eq $CUR) { continue }
              if (DeleteRel $pre[$i]) { Write-Host "  cap deleted: $($pre[$i].tag_name)"; $deleted++ }
            }
          }
          Write-Host "========== cleanup done: deleted $deleted releases =========="

  # Failure notification: if check or build fails, create/append an issue with a
  # fixed title (no spam). The notification itself never fails the workflow.
  notify:
    needs: [check, build]
    if: always() && (needs.check.result == 'failure' || needs.build.result == 'failure') && github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      issues: write
      contents: read
    steps:
      - name: Open or update failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set +e
          TITLE="🚨 Vaultwarden build FAILED"
          URL="https://github.com/$REPO/actions/runs/$RUN_ID"
          NUM=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/$REPO/issues?state=open" \
                | jq -r --arg t "$TITLE" '.[] | select(.title==$t) | .number' | head -n1)
          BODY="Build failed at $URL (run #$RUN_ID)."
          PAYLOAD=$(jq -nc --arg b "$BODY" '{body:$b}')
          if [ -n "$NUM" ]; then
            curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/issues/$NUM/comments" -d "$PAYLOAD" >/dev/null
            echo "commented on issue #$NUM"
          else
            CREATE=$(jq -nc --arg t "$TITLE" --arg b "$BODY" '{title:$t,body:$b}')
            curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/issues" -d "$CREATE" >/dev/null
            echo "created new failure issue"
          fi
          exit 0
